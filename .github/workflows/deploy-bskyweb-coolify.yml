name: deploy-bskyweb-coolify

# Build the bskyweb Docker image, push it to GHCR, then ask Coolify to roll
# out a new deployment on the k4m2a-core server.
#
# The image is built here rather than on the server on purpose: the Expo web
# bundle plus the Go build is far too heavy for a box that also has to host
# the PDS. Coolify only ever pulls the finished image.
on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-push-deploy:
    # Don't run upstream's gated workflows in our fork by accident, and
    # don't run this fork-specific deploy if someone pulls the workflow
    # file into a different fork.
    if: github.repository == 'k4m2a/social-app'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Compute short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::9}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what the Coolify compose file tracks; the SHA tag is kept
      # so a specific build can be pinned by hand when rolling back.
      - name: Build and push image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Coolify deployment
        id: deploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_UUID: ${{ vars.COOLIFY_RESOURCE_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail

          response=$(curl -sS --fail-with-body -X GET \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            "$COOLIFY_URL/api/v1/deploy?uuid=$COOLIFY_UUID&force=false")

          echo "$response"

          # The API returns a list of queued deployments; grab the first uuid
          # so the next step can follow it to completion.
          deployment_uuid=$(echo "$response" \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["deployments"][0]["deployment_uuid"])')

          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"
          echo "queued deployment $deployment_uuid"

      - name: Wait for deployment to finish
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 90); do
            status=$(curl -sS \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              "$COOLIFY_URL/api/v1/deployments/$DEPLOYMENT_UUID" \
              | python3 -c 'import sys,json; print(json.load(sys.stdin).get("status","unknown"))')

            echo "deployment status: $status"

            case "$status" in
              finished)          echo "deployment finished"; exit 0 ;;
              failed|cancelled)  echo "deployment $status"; exit 1 ;;
            esac
            sleep 10
          done

          echo "timed out waiting for deployment"
          exit 1
